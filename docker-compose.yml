services:

  # =========================================================
  # FRONTEND
  # Host: http://localhost:5174
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development

    container_name: scms-frontend

    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"

    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    networks:
      - scms-network

    restart: unless-stopped


  # =========================================================
  # BACKEND
  # Host: http://localhost:8081
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development

    container_name: scms-backend

    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}

    depends_on:
      - postgres
      - redis
      - minio
      - rabbitmq

    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2

    networks:
      - scms-network

