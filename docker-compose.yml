services:

  # =========================================================
  # FRONTEND
  # Host: localhost:5174
  # Container: 5173
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development

    container_name: scms-frontend

    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5173"

    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules

    restart: unless-stopped

    networks:
      - scms-network

    depends_on:
      backend:
        condition: service_healthy


  # =========================================================
  # BACKEND
  # Host: localhost:8081
  # Container: 8080
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: scms-backend

    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      # PostgreSQL internal Docker connection
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis internal Docker connection
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # MinIO internal Docker connection
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # RabbitMQ internal Docker connection
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}

    restart: unless-stopped

    networks:
      - scms-network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


  # =========================================================
  # POSTGRESQL
  # Host: localhost:5433
  # Container: 5432
  # =========================================================
  postgres:
    image: postgres:15-alpine

    container_name: scms-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - scms-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # PGADMIN
  # Host: localhost:5051
  # Container: 80
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:9.12

    container_name: scms-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "${PGADMIN_HOST_PORT:-5051}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    restart: unless-stopped

    networks:
      - scms-network

    depends_on:
      postgres:
        condition: service_healthy


  # =========================================================
  # REDIS
  # Host: localhost:6380
  # Container: 6379
  # =========================================================
  redis:
    image: redis:7-alpine

    container_name: scms-redis

    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

    networks:
      - scms-network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # MINIO
  # API Host: localhost:9002
  # Console Host: localhost:9003
  #
  # Internal:
  # API: 9000
  # Console: 9001
  # =========================================================
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z

    container_name: scms-minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9003}:9001"

    volumes:
      - minio_data:/data

    restart: unless-stopped

    networks:
      - scms-network

    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 15s
      timeout: 5s
      retries: 5


  # =========================================================
  # RABBITMQ
  # AMQP Host: localhost:5673
  # Management Host: localhost:15673
  #
  # Internal:
  # AMQP: 5672
  # Management: 15672
  # =========================================================
  rabbitmq:
    image: rabbitmq:3-management

    container_name: scms-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

    ports:
      - "${RABBITMQ_HOST_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    restart: unless-stopped

    networks:
      - scms-network

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "check_running"
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s


# =========================================================
# NETWORK
# =========================================================
networks:
  scms-network:
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================
volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  minio_data:
  rabbitmq_data: